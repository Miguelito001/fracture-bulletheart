name: FRACTURE Open Asset Integration
on:
  push:
    branches: [feature/isometric-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kenney:
    if: "contains(github.event.head_commit.message, 'artpass: import Kenney sprites') || contains(github.event.head_commit.message, 'artpass: import Kenney characters')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get required open art processing dependency
        run: python -m pip install Pillow
      - name: Download and bundle Kenney CC0 source sprites
        run: |
          python tools/import_kenney_cc0.py
          python tools/import_kenney_characters.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check, build and run asset and game tests
        run: |
          npm install
          npm run check
          npm run build
          npm test
      - name: Publish tested CC0 sprites into preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kenney
          git diff --cached --quiet || git commit -m "feat: bundle 48 Kenney CC0 characters and 48 environment sprites"
          git push origin HEAD:feature/isometric-v2

  browser-qa:
    if: "contains(github.event.head_commit.message, 'artpass: run browser QA') || contains(github.event.head_commit.message, 'feat: bundle 48 Kenney CC0 characters')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install browser engine and compile
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
          npm install
          npm run build
          npm test
      - name: Verify 48 Kenney images in Chromium and enter dungeon
        run: python tools/browser_kenney_smoke.py
      - name: Keep screenshots for visual review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: FRACTURE-ISOV2-Kenney-screenshots
          path: |
            artpass-hub-smoke.png
            artpass-dungeon-smoke.png
