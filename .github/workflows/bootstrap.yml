name: FRACTURE Open Asset Integration
on:
  push:
    branches: [feature/isometric-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  kenney:
    if: "contains(github.event.head_commit.message, 'artpass: import Kenney sprites')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Get required open art processing dependency
        run: python -m pip install Pillow
      - name: Download and bundle Kenney CC0 source sprites
        run: python tools/import_kenney_cc0.py
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check, build and run asset and game tests
        run: |
          npm install
          npm run check
          npm run build
          npm test
      - name: Publish tested CC0 sprites into preview branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/kenney
          git diff --cached --quiet || git commit -m "feat: bundle 48 Kenney CC0 dungeon and library sprites"
          git push origin HEAD:feature/isometric-v2
