name: FRACTURE Citadel Architecture and Browser QA
on:
  push:
    branches: [feature/isov2-cartoon]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    if: "!contains(github.event.head_commit.message, 'ci: capture isometric screenshots')"
    concurrency:
      group: fracture-visual-${{ github.ref }}
      cancel-in-progress: true
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Import verified Kenney CC0 voxel sprites
        run: python tools/import_voxel_cc0.py
      - name: Compile and validate
        run: |
          npm ci
          npm run check
          npm run build
          npm test
      - name: Browser render and capture
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          python tools/browser_kenney_smoke.py
      - name: Capture both scenes in repository
        run: |
          mkdir -p qa/screenshots
          cp artpass-hub-smoke.png qa/screenshots/hub-latest.png
          cp artpass-dungeon-smoke.png qa/screenshots/dungeon-latest.png
          cp artpass-combat-smoke.png qa/screenshots/combat-latest.png
          python - <<'PY'
          from PIL import Image
          im=Image.open('artpass-hub-smoke.png').convert('RGB')
          im.thumbnail((950,540))
          im.save('qa/screenshots/hub-small.jpg',quality=72,optimize=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/voxel qa/screenshots/*.png qa/screenshots/*.jpg
          git commit -m "ci: capture isometric screenshots" || exit 0
          git push origin feature/isov2-cartoon
