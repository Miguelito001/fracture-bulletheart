name: Isometric visual review
on:
  push:
    branches: [feature/isometric-v2]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  screenshots:
    if: "!contains(github.event.head_commit.message, 'ci: capture isometric screenshots')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile and validate
        run: |
          npm ci
          npm run check
          npm run build
          npm test
      - name: Browser render and capture
        run: |
          python -m pip install playwright Pillow
          python -m playwright install --with-deps chromium
          python tools/browser_kenney_smoke.py
      - name: Capture both scenes in repository
        run: |
          mkdir -p qa/screenshots
          cp artpass-hub-smoke.png qa/screenshots/hub-latest.png
          cp artpass-dungeon-smoke.png qa/screenshots/dungeon-latest.png
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add qa/screenshots/*.png
          git commit -m "ci: capture isometric screenshots" || exit 0
          git push origin feature/isometric-v2
