name: FRACTURE 1.3 — preserve and polish
on:
  push:
    branches: [feature/stable-1-3-polish]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fracture-stable-1-3-${{ github.ref }}
  cancel-in-progress: true
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install build dependencies
        run: npm ci --no-audit --no-fund
      - name: Strict TypeScript verification
        run: npm run check
      - name: Compile stable game
        run: npm run build
      - name: Run core mechanics regression tests
        run: npm test
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install real Chromium browser
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Real-player controls, combat and loadout QA
        run: python tools/qa_stable.py
      - name: Keep gameplay screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fracture-original-stable-1-3-gameplay
          path: qa-stable-gameplay.png
          if-no-files-found: ignore
          retention-days: 14
