name: FRACTURE Cryptfire — complete game QA
on:
  push:
    branches: [feature/fracture-torchlit-rebuild]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: fracture-cryptfire-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-and-play:
    runs-on: ubuntu-latest
    timeout-minutes: 28
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install engine dependencies
        run: npm install --no-audit --no-fund
      - name: Fetch pinned open-source art and sound
        run: npm run assets
      - name: Original game regression tests
        run: npm test
      - name: Compile and typecheck
        run: npm run typecheck
      - name: Build the complete ARPG
        run: npm run build
      - name: Install real Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser test and screenshot
        run: npm run test:browser
      - name: Archive gameplay and generated website
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fracture-cryptfire-build-and-browser-qa
          path: |
            dist/
            qa/
          retention-days: 14
