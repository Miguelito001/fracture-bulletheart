<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1.0" />
  <meta name="theme-color" content="#101925" />
  <title>FRACTURE: BULLETHEART — 3D Rebuild</title>
</head>
<body>
  <canvas id="scene" aria-label="FRACTURE: masmorra 3D interativa"></canvas>
  <main id="ui">
    <div id="loading">Carregando o novo FRACTURE…</div>
    <div id="menu" class="hidden"></div>
    <div id="hud" class="hidden">
      <section class="hud-top">
        <div class="stat-block">
          <div class="caption"><span>✦ FRACTURE / BULLETHEART</span><span id="status">REFÚGIO SEGURO</span></div>
          <div class="health-track"><div id="healthfill"></div></div>
          <div class="caption secondary"><span id="healthtext">100 / 100</span><span id="level">NÍVEL 1</span><span id="xp">XP 0</span></div>
        </div>
        <div class="room-head"><div class="eyebrow" id="objective">CÂMARA ÂNCORA</div><div id="roomname">CÂMARA ÂNCORA</div></div>
        <div class="purse"><span>✧ ECOS</span><b id="echoes">0</b><div id="materials">FERRO 0 · BRASAS 0</div></div>
      </section>
      <div id="crosshair"></div>
      <section class="hud-bottom">
        <div class="weapon-group"><button data-action="blade"><kbd>1</kbd> ⚔ <span id="stance">LÂMINA ERRANTE</span></button>
          <button data-action="gun"><kbd>2</kbd> ⊕ <span>REVÓLVER</span></button></div>
        <div class="ability-group"><button data-action="dodge">⤨ <span>ESQUIVA</span><kbd>ESPAÇO</kbd></button>
          <button data-action="attack">⚔ <span>ATACAR</span><kbd>CLIQUE</kbd></button>
          <button data-action="interact">✧ <span>INTERAGIR</span><kbd>E</kbd></button>
          <button data-action="heal">✚ <span>POÇÃO: <b id="potions">2</b></span><kbd>H</kbd></button></div>
      </section>
      <div id="notice" class="hidden" role="status"></div>
      <div id="controls">WASD PARA MOVER · E INTERAGIR</div>
      <button data-action="pause" id="pause">Ⅱ</button>
    </div>
  </main>
  <script type="module" src="/src3d/game.js"></script>
</body>
</html>
